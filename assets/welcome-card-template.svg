<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1680" height="941" viewBox="0 0 1680 941">
  <defs>
    <clipPath id="avatarClip">
      <circle cx="435" cy="438" r="220"/>
    </clipPath>
    <linearGradient id="usernameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8D8FF"/>
      <stop offset=".46" stop-color="#A99CFF"/>
      <stop offset="1" stop-color="#7188FF"/>
    </linearGradient>
    <linearGradient id="avatarStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2EA8FF"/>
      <stop offset=".55" stop-color="#6575FF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="avatarShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity=".72"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#020617" flood-opacity=".75"/>
    </filter>
  </defs>

  <!-- RUNTIME_TEMPLATE_IMAGE -->

  <!-- Profil resmi kaynak tasarımdaki dairesel alanın içine kırpılır. -->
  <!-- RUNTIME_AVATAR -->

  <!-- Kaynak görseldeki örnek kullanıcı metnini kapatan dinamik kullanıcı kapsülü. -->
  <g>
    <rect x="842" y="493" width="366" height="96" rx="48"
      fill="#080F1D" stroke="#263249" stroke-width="4"/>
    <rect x="849" y="500" width="352" height="82" rx="41"
      fill="#0A1120" opacity=".94"/>
    <!-- RUNTIME_USERNAME -->
  </g>

  <!-- Alt alandaki örnek sunucu adı dinamik olarak değiştirilir. -->
  <g>
    <rect x="764" y="765" width="380" height="72" rx="24" fill="#0A1221" opacity=".98"/>
    <!-- RUNTIME_SERVER_NAME -->
  </g>
</svg>
